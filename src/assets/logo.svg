<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>
    <linearGradient id="glowRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#B45309" stop-opacity="0.3" />
    </linearGradient>
    <filter id="amberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Glow -->
  <circle cx="100" cy="100" r="82" fill="none" stroke="url(#glowRing)" stroke-width="2.5" opacity="0.6" />
  <circle cx="100" cy="100" r="72" fill="#231B15" />

  <!-- Outer Ring with Gradient -->
  <circle cx="100" cy="100" r="72" fill="none" stroke="url(#amberGrad)" stroke-width="3.5" filter="url(#amberGlow)" />

  <!-- Inner Amber Accents -->
  <circle cx="100" cy="100" r="64" fill="none" stroke="#D97706" stroke-width="1" stroke-dasharray="4 4" opacity="0.5" />

  <!-- Monogram RR -->
  <g fill="url(#amberGrad)" filter="url(#amberGlow)">
    <!-- First 'R' -->
    <path d="M 62 60 L 84 60 C 95 60 102 66 102 75 C 102 83 96 88 88 90 L 104 135 L 90 135 L 76 94 L 74 94 L 74 135 L 62 135 Z M 74 71 L 74 83 L 83 83 C 88 83 91 80 91 77 C 91 74 88 71 83 71 Z" />
    <!-- Second 'R' overlapping/interlocking slightly -->
    <path d="M 102 65 L 122 65 C 132 65 138 71 138 79 C 138 86 133 91 126 93 L 140 135 L 127 135 L 115 97 L 114 97 L 114 135 L 102 135 Z M 114 76 L 114 87 L 121 87 C 126 87 128 84 128 81.5 C 128 79 126 76 121 76 Z" opacity="0.95" />
  </g>

  <!-- Amber Sparkle / Core Node -->
  <circle cx="100" cy="100" r="3" fill="#FEF3C7" filter="url(#amberGlow)" />
</svg>